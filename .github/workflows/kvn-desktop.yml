name: kvn desktop build

# Daily: put the kvn commits (still-watching, update source) on top of the
# latest upstream NuvioDesktop release, build Linux RPM + AppImage and macOS arm64 DMG,
# and publish them as a release of this fork. The app's updater reads these.
#
# Platforms are independent: if one build fails (often just no free macOS
# runner), the others are still released. The next run builds only what the
# release lacks, and kvn-retry.yml re-runs runner failures the same day.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this source was already released
        type: boolean
        default: false

# Only the release job may write; the build jobs run upstream build scripts.
permissions:
  contents: read

concurrency:
  group: kvn-desktop
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NuvioMedia/NuvioDesktop
  FEATURE_BRANCH: kvn
  APPIMAGE_TOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      version: ${{ steps.plan.outputs.version }}
      number: ${{ steps.plan.outputs.number }}
      upstream: ${{ steps.plan.outputs.upstream }}
      tree: ${{ steps.plan.outputs.tree }}
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          path: src
          fetch-depth: 0
      # Not persist-credentials: false, its cleanup trips over upstream's broken
      # libass-android submodule entry. Drop the token by hand instead.
      - name: Drop checkout credentials
        working-directory: src
        run: |
          set -euo pipefail
          # checkout keeps the token in an included config file and/or an extraheader.
          git config --local --name-only --get-regexp '^includeif\.' | while read -r key; do
            rm -f "$(git config --local --get "${key}")"
            git config --local --unset-all "${key}"
          done || true
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          if git config --list --show-origin --includes | grep -i -e extraheader -e includeif; then
            echo "::error::Checkout credentials are still configured." >&2
            exit 1
          fi
      - id: plan
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: bash ../ci/scripts/kvn-prepare.sh plan

  linux:
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.build_linux == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # RPM release 1.kvn<n> sorts above upstream's release 1 and above earlier kvn builds.
      LINUX_APP_RELEASE: 1.kvn${{ needs.prepare.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          path: src
          fetch-depth: 0
      # Not persist-credentials: false, its cleanup trips over upstream's broken
      # libass-android submodule entry. Drop the token by hand instead.
      - name: Drop checkout credentials
        working-directory: src
        run: |
          set -euo pipefail
          # checkout keeps the token in an included config file and/or an extraheader.
          git config --local --name-only --get-regexp '^includeif\.' | while read -r key; do
            rm -f "$(git config --local --get "${key}")"
            git config --local --unset-all "${key}"
          done || true
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          if git config --list --show-origin --includes | grep -i -e extraheader -e includeif; then
            echo "::error::Checkout credentials are still configured." >&2
            exit 1
          fi
      - name: Rebase onto upstream release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_TREE: ${{ needs.prepare.outputs.tree }}
        run: bash ../ci/scripts/kvn-prepare.sh rebase
      - name: Install build dependencies
        working-directory: src
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh fakeroot rpm cpio
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Write local.properties
        working-directory: src
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.KVN_LOCAL_PROPERTIES_BASE64 }}
        run: printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
      - name: Build RPM and AppImage
        working-directory: src
        run: |
          set -euo pipefail
          tool="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl -fsSL -o "${tool}" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGE_TOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum --check
          chmod +x "${tool}"
          export APPIMAGETOOL="${tool}"
          export APPIMAGE_WEBSITE_URL="https://github.com/${GITHUB_REPOSITORY}"
          # One Gradle run per package, like upstream's desktop-release.yml: since
          # Compose 1.13 both tasks write binaries/main-release/app, and Gradle
          # rejects that overlap when they share a run.
          for task in packageReleaseRpm packageReleaseAppImage; do
            ./gradlew ":composeApp:${task}" \
              "-Pnuvio.desktop.versionName=${VERSION}" \
              "-Pnuvio.linux.appRelease=${LINUX_APP_RELEASE}" \
              -Pcompose.desktop.packaging.checkJdkVendor=false \
              --no-configuration-cache --no-daemon --stacktrace
          done
          out="composeApp/build/compose/release-appimages/Nuvio-Linux-x86_64-${VERSION}.AppImage"
          test -f "${out}"
          mapfile -t rpms < <(find composeApp/build/compose/binaries/main-release/rpm -maxdepth 1 -name '*.rpm')
          test "${#rpms[@]}" -eq 1
          rpm -qp --queryformat '%{NAME}-%{VERSION}-%{RELEASE}\n' "${rpms[0]}"
          mkdir -p "${RUNNER_TEMP}/dist"
          mkdir -p "${RUNNER_TEMP}/rpm"
          cp "${out}" "${RUNNER_TEMP}/dist/"
          cp "${rpms[0]}" "${RUNNER_TEMP}/rpm/Nuvio-Linux-x86_64-${VERSION}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-unsigned
          path: ${{ runner.temp }}/rpm/*
          if-no-files-found: error

  # Signs the RPM with the repo key. Runs no upstream code.
  sign-rpm:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-rpm-unsigned
          path: rpm
      - name: Sign RPM
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.KVN_REPO_GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.KVN_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends --yes rpm
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          printf '%s' "${GPG_PASSPHRASE}" > "${GNUPGHOME}/pass"
          printf '%s' "${GPG_PRIVATE_KEY_BASE64}" | base64 --decode |
            gpg --batch --pinentry-mode loopback --passphrase-file "${GNUPGHOME}/pass" --import
          fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          rpm --define "_gpg_name ${fpr}" \
            --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file ${GNUPGHOME}/pass" \
            --addsign rpm/*.rpm
          gpg --batch --armor --export "${fpr}" > "${RUNNER_TEMP}/pub.asc"
          db="${RUNNER_TEMP}/rpmdb"
          mkdir -p "${db}"
          rpmkeys --dbpath "${db}" --import "${RUNNER_TEMP}/pub.asc"
          rpmkeys --dbpath "${db}" --checksig rpm/*.rpm
          rm -rf "${GNUPGHOME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: rpm/*.rpm
          if-no-files-found: error

  macos:
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.build_macos == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          path: src
          fetch-depth: 0
      # Not persist-credentials: false, its cleanup trips over upstream's broken
      # libass-android submodule entry. Drop the token by hand instead.
      - name: Drop checkout credentials
        working-directory: src
        run: |
          set -euo pipefail
          # checkout keeps the token in an included config file and/or an extraheader.
          git config --local --name-only --get-regexp '^includeif\.' | while read -r key; do
            rm -f "$(git config --local --get "${key}")"
            git config --local --unset-all "${key}"
          done || true
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          if git config --list --show-origin --includes | grep -i -e extraheader -e includeif; then
            echo "::error::Checkout credentials are still configured." >&2
            exit 1
          fi
      - name: Rebase onto upstream release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_TREE: ${{ needs.prepare.outputs.tree }}
        run: bash ../ci/scripts/kvn-prepare.sh rebase
      - name: Fetch the macOS libmpv runtime (Git LFS)
        working-directory: src
        # Anonymous download from upstream; the files are the same there.
        run: |
          git -c "lfs.url=https://github.com/${UPSTREAM_REPO}.git/info/lfs" lfs pull \
            --include="composeApp/src/desktopMain/native/macos/runtime/arm64/**" --exclude=""
          file composeApp/src/desktopMain/native/macos/runtime/arm64/libmpv.2.dylib
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Write local.properties
        working-directory: src
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.KVN_LOCAL_PROPERTIES_BASE64 }}
        run: printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
      - name: Build unsigned DMG
        working-directory: src
        env:
          NUVIO_MACOS_SIGNING_IDENTITY: ""
          NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ""
        run: |
          set -euo pipefail
          ./gradlew :composeApp:packageReleaseDmg \
            "-Pnuvio.desktop.versionName=${VERSION}" \
            -Pnuvio.macos.arch=arm64 \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace
          out="composeApp/build/compose/release-dmgs/Nuvio-macOS-arm64-${VERSION}.dmg"
          test -f "${out}"
          mkdir -p "${RUNNER_TEMP}/dist"
          cp "${out}" "${RUNNER_TEMP}/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  release:
    needs: [prepare, sign-rpm, macos]
    # Release whatever built; a failed platform must not hold back the others.
    if: >-
      always() && needs.prepare.outputs.build == 'true' &&
      (needs.sign-rpm.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux-appimage,linux-rpm,macos}"
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          TREE: ${{ needs.prepare.outputs.tree }}
          COMMITS: ${{ needs.prepare.outputs.commits }}
          LINUX_RESULT: ${{ needs.sign-rpm.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          # "skipped" means the release already has that platform.
          for platform in linux macos; do
            result_var="${platform^^}_RESULT"
            if [[ "${!result_var}" != success && "${!result_var}" != skipped ]]; then
              echo "::warning::${platform} build ${!result_var}; releasing the other platforms. The next run adds ${platform}."
            fi
          done
          {
            echo "Upstream release: [${UPSTREAM}](https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM})"
            echo
            echo "kvn commits on top:"
            echo "${COMMITS}"
            echo
            echo "Source tree: \`${TREE}\`"
          } > notes.md
          # The release exists when this run only completes missing platforms,
          # or when a re-run adds a platform after the first attempt released.
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${VERSION}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target kvn-ci \
              --title "Nuvio ${VERSION}" \
              --notes-file notes.md \
              --latest
          fi

  # Publishes the dnf repo (metadata on GitHub Pages, packages stay in the release).
  rpm-repo:
    needs: [prepare, sign-rpm, release]
    # Only when this run built a new signed RPM.
    if: always() && needs.release.result == 'success' && needs.sign-rpm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: site/rpm
      - name: Build and sign repo metadata
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.KVN_REPO_GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.KVN_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends --yes createrepo-c
          # Packages are too big for Pages (100 MB); point dnf at the release assets.
          createrepo_c --baseurl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/" site/rpm
          rm site/rpm/*.rpm
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          printf '%s' "${GPG_PASSPHRASE}" > "${GNUPGHOME}/pass"
          printf '%s' "${GPG_PRIVATE_KEY_BASE64}" | base64 --decode |
            gpg --batch --pinentry-mode loopback --passphrase-file "${GNUPGHOME}/pass" --import
          gpg --batch --pinentry-mode loopback --passphrase-file "${GNUPGHOME}/pass" \
            --armor --detach-sign site/rpm/repodata/repomd.xml
          rm -rf "${GNUPGHOME}"
          cp ci/repo/RPM-GPG-KEY-nuvio-kvn ci/repo/nuvio-kvn.repo site/
          find site -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
